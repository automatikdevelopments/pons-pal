# SPDX-License-Identifier: MIT
# Pons Family - continuous integration for pons.family
#
# The local mirror of the zauth Vector gate. Lint, types, and tests run first
# because a red build should fail on the cheap check; the security jobs run in
# parallel because none of them depends on the others, and a repository that
# holds a fund-moving key should learn about a leaked secret in the same minute
# it learns about a lint error.
#
# Every job is blocking. A finding is fixed, never suppressed.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - run: pytest

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # Fails the build on any known advisory. Pinned versions mean an advisory
      # is a decision to make, not a transitive surprise to discover in prod.
      - run: pip-audit -r requirements.txt --strict

  sast:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - run: bandit -q -r src -c pyproject.toml

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A trading key in git history is a compromised wallet, not a bad commit.
      # The full history is fetched so a key introduced and later removed is
      # still caught.
      # The gitleaks GitHub Action needs a paid license for organization
      # accounts, so the scanner runs from the pinned release binary instead.
      # The checksum is verified before anything is executed.
      - name: install gitleaks
        env:
          VERSION: "8.30.1"
        run: |
          curl -sSfL -O \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          grep "gitleaks_${VERSION}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
      - run: gitleaks git --no-banner --redact --config .gitleaks.toml .
