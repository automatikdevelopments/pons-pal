# SPDX-License-Identifier: MIT
# Pons Family - secret scanning configuration for pons.family
#
# Extends the upstream default rules with the two patterns that matter most
# here: a raw EVM private key, and the Pons Pal variables that carry one. The
# allowlist covers `.env.example`, whose values are blank by design, and the
# test suite, whose keys are the well-known synthetic constants that control no
# funded account.

title = "pons-pal"

[extend]
useDefault = true

[[rules]]
id = "evm-private-key"
description = "Raw 32-byte EVM private key"
regex = '''0x[a-fA-F0-9]{64}'''
keywords = ["0x"]

[[rules]]
id = "pons-pal-key-assignment"
description = "A Pons Pal secret variable assigned a non-empty value"
regex = '''(?i)(PONS_PAL_TRADING_KEY|PONS_PAL_CYCLE_SECRET|PONS_PAL_MODEL_API_KEY|STOCK_DATA_API_KEY)\s*=\s*["']?[A-Za-z0-9_\-\.]{8,}'''
keywords = ["PONS_PAL_TRADING_KEY", "PONS_PAL_CYCLE_SECRET", "PONS_PAL_MODEL_API_KEY", "STOCK_DATA_API_KEY"]

[allowlist]
description = "Blank example values and synthetic test fixtures"
paths = [
  '''\.env\.example$''',
  '''tests/.*''',
  '''\.gitleaks\.toml$''',
  '''\.venv/.*''',
]
